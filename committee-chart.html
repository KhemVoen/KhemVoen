<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>រចនាសម្ព័ន្ធអាចារ្យ & គណៈកម្មការ — វត្តខេមវ័ន(បឹងស្នាយ)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 + ReactDOM + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans Khmer', sans-serif;
      background: #faf5eb;
      min-height: 100vh;
      color: #334155;
      display: flex;
    }

    /* ── Sidebar Layout ── */
    .admin-sidebar {
      width: 250px;
      background: #112236;
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      color: #94a3b8;
    }

    .sidebar-brand {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-brand h2 {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      margin: 0;
      line-height: 1.2;
    }
    .sidebar-brand span {
      font-size: 0.72rem;
      color: #d4a843;
    }

    .sidebar-menu {
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .menu-item:hover {
      background: rgba(255,255,255,0.06);
      color: #f1f5f9;
    }
    .menu-item.active {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(29,78,216,0.3);
    }

    /* ── Main Content Area ── */
    .admin-main {
      flex: 1;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .top-header {
      background: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }
    .header-title p {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2px;
    }

    .fullscreen-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .fullscreen-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    /* ── Dual Panel Parchment Frame ── */
    .tree-wrapper {
      padding: 20px 24px 40px;
      max-width: 1650px;
      margin: 0 auto;
      width: 100%;
    }

    .gold-card-container {
      background: linear-gradient(135deg, #fdfbf7 0%, #f7efdf 50%, #fdfbf7 100%);
      border: 2.5px solid #d4a843;
      border-radius: 24px;
      padding: 30px 20px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.06), 0 4px 16px rgba(212,168,67,0.12), inset 0 0 0 4px rgba(212,168,67,0.15);
      position: relative;
      overflow: hidden;
    }

    /* Khmer Motif Background Watermarks */
    .bg-watermark-left, .bg-watermark-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 160px;
      opacity: 0.06;
      pointer-events: none;
      background-image: radial-gradient(#b88429 2px, transparent 2px);
      background-size: 16px 16px;
    }
    .bg-watermark-left { left: 0; }
    .bg-watermark-right { right: 0; }

    .top-lotus-emblem {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.2rem;
      color: #d4a843;
      z-index: 10;
      filter: drop-shadow(0 2px 5px rgba(212,168,67,0.35));
    }

    .dual-grid {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      position: relative;
      z-index: 2;
    }

    .panel-box {
      flex: 1;
      background: linear-gradient(180deg, #fffdf8 0%, #faf2e3 100%);
      border: 2px solid #c99a32;
      border-radius: 20px;
      padding: 18px 12px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(180,130,40,0.08), inset 0 0 0 3.5px rgba(255,255,255,0.8);
    }

    .panel-header-banner {
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #e7cb82 0%, #d4a843 50%, #c59628 100%);
      color: #2c1810;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1.55rem;
      font-weight: 900;
      font-family: 'Noto Sans Khmer', sans-serif;
      border: 1.5px solid #b88429;
      box-shadow: 0 4px 12px rgba(212,168,67,0.28);
      margin-bottom: 22px;
      text-shadow: 0 1px 1px rgba(255,255,255,0.5);
      position: relative;
    }

    /* ── CARD AESTHETICS ── */
    .oc-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .oc-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(180,130,40,0.18), 0 0 0 2.5px rgba(212,168,67,0.6) !important;
    }

    .oc-btn {
      border: none; cursor: pointer; border-radius: 6px;
      padding: 4px 10px; font-size: 0.72rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 4px;
      transition: all 0.2s ease;
    }
    .oc-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

    /* ── ANIMATED RUNNING LINE STYLE ── */
    @keyframes dashRun {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -20; }
    }
    .running-line-bg {
      stroke: rgba(212,168,67,0.35);
      stroke-width: 4;
      stroke-linecap: round;
    }
    .running-line-fg {
      stroke: #b88429;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 6 4;
      animation: dashRun 0.9s linear infinite;
    }

    /* Pulsing joints */
    @keyframes ocPulse {
      0%, 100% { r: 4; opacity: 0.85; }
      50% { r: 6; opacity: 1; }
    }
    .oc-joint { animation: ocPulse 2.5s ease-in-out infinite; }

    @media (max-width: 1200px) {
      .dual-grid { flex-direction: column; }
      .admin-sidebar { display: none; }
    }

    /* ── IFRAME EMBEDDING CLEANUP ── */
    body.is-public .oc-btn {
      display: none !important;
    }
    body.is-embedded {
      background: transparent !important;
    }
    body.is-embedded .admin-sidebar,
    body.is-embedded .top-header {
      display: none !important;
    }
    body.is-embedded .admin-main {
      height: auto !important;
      background: transparent !important;
    }
    body.is-embedded .tree-wrapper {
      padding: 10px !important;
    }

    /* Segmented Tab Switcher */
    .tab-switcher-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .tab-switcher-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(212, 168, 67, 0.45);
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(212, 168, 67, 0.15);
      position: relative;
      z-index: 10;
    }

    .tab-nav-btn {
      background: transparent;
      color: #475569;
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      outline: none;
      user-select: none;
    }

    .tab-nav-btn:hover {
      color: #1a3a5c;
      background: rgba(212, 168, 67, 0.12);
      transform: translateY(-2px);
    }

    .tab-nav-btn.active {
      background: linear-gradient(135deg, #1a3a5c 0%, #2c5282 100%);
      color: #f0d48a;
      border-color: #d4a843;
      box-shadow: 0 6px 18px rgba(26, 58, 92, 0.35);
      transform: scale(1.02);
    }

    .tab-nav-btn:active {
      transform: scale(0.96);
    }

    .tab-nav-btn .tab-icon {
      font-size: 1.05rem;
      transition: transform 0.3s ease;
    }

    .tab-nav-btn.active .tab-icon {
      transform: scale(1.2) rotate(-6deg);
    }

    /* Animated entrance and exit transitions */
    @keyframes chartPageEnter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .gold-card-container {
      animation: chartPageEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform, filter;
      transition: opacity 0.2s ease, transform 0.2s ease, filter 0.2s ease;
    }

    .page-transition-exit {
      opacity: 0 !important;
      transform: translateY(-12px) scale(0.98) !important;
      filter: blur(4px) !important;
    }
  </style>
</head>

<body>
  <div id="root" style="width: 100%; display: flex;"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    /* ═══════════════════════════════════════════════════════════════════
       INITIAL DATA — Lay Officiants (អាចារ្យ) & Committee (គណៈកម្មការ)

    const INITIAL_COMMITTEE_DATA = {

          role: 'អនុប្រធានគណៈកម្មការ',

        {

          role: 'អាចារ្យធំ / ពិធីការ',

        },
        {

          roleEn: 'Chief Treasurer',
          avatar: '',

          carrier: 'CELLCARD',
          sticker: '🪷',

        },
        {
          id: 'com-sub-3',
          name: 'លោក អាចារ្យ ហេង ស៊ាង',
          role: 'អាចារ្យរៀបចំពិធី',
          roleEn: 'Ritual Coordinator',
          avatar: '',
          phone: '088 111 222',
          carrier: 'METFONE',
          sticker: '📿',
          fb: '#',
          position: 'right',
          parentId: 'com-dep-2',
        },
      ],
    };

    const CARRIER = {
      CELLCARD: { bg: '#fff0e6', fg: '#c85a00', border: '#ffb380' },
      METFONE:  { bg: '#fee2e2', fg: '#991b1b', border: '#fca5a5' },
      SMART:    { bg: '#dcfce7', fg: '#166534', border: '#86efac' },
    };
    const carrierStyle = (c) => CARRIER[String(c).toUpperCase()] ?? { bg: '#f3f4f6', fg: '#374151', border: '#d1d5db' };

    /* ═══════════════════════════════════════════════════════════════════
       NODE CARD COMPONENT — With Decorative Corner Cutouts & Frame
    ═══════════════════════════════════════════════════════════════════ */
    function NodeCard({ node, tier = 1, onEdit, onDelete, section = 'achar' }) {
      const cs1 = node.carrier ? carrierStyle(node.carrier) : null;

      const sizing = {
        1: { cardW: 190, avatarSz: 64, nameSz: '1.02rem', roleSz: '0.68rem' },
        2: { cardW: 175, avatarSz: 56, nameSz: '0.9rem',  roleSz: '0.64rem' },
        3: { cardW: 165, avatarSz: 50, nameSz: '0.86rem', roleSz: '0.62rem' },
      };
      const s = sizing[tier] || sizing[2];
      const borderColor = '#c99a32';

      return (
        <div
          className="oc-card"
          style={{
            width: s.cardW,
            background: 'linear-gradient(180deg, #fffdfa 0%, #faf2e4 100%)',
            borderRadius: 16,
            border: `2px solid ${borderColor}`,
            boxShadow: `0 6px 20px rgba(180,130,40,0.1), inset 0 0 0 2.5px rgba(255,255,255,0.7)`,
            padding: '14px 10px 12px',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            gap: 5,
            position: 'relative',
          }}
        >
          {/* Khmer Gold Corner Motifs */}
          <div style={{ position: 'absolute', top: 3, left: 3, width: 7, height: 7, borderTop: '2px solid #b88429', borderLeft: '2px solid #b88429' }} />
          <div style={{ position: 'absolute', top: 3, right: 3, width: 7, height: 7, borderTop: '2px solid #b88429', borderRight: '2px solid #b88429' }} />
          <div style={{ position: 'absolute', bottom: 3, left: 3, width: 7, height: 7, borderBottom: '2px solid #b88429', borderLeft: '2px solid #b88429' }} />
          <div style={{ position: 'absolute', bottom: 3, right: 3, width: 7, height: 7, borderBottom: '2px solid #b88429', borderRight: '2px solid #b88429' }} />

          {/* Top Decorative Notch */}
          <div style={{
            position: 'absolute', top: -1, left: '50%', transform: 'translateX(-50%)',
            width: 32, height: 3, background: borderColor, borderRadius: '0 0 4px 4px',
          }} />

          {/* Avatar Area */}
          <div style={{ position: 'relative', width: s.avatarSz, height: s.avatarSz, flexShrink: 0 }}>
            <div style={{
              width: '100%', height: '100%',
              borderRadius: '50%',
              border: `2.5px solid ${borderColor}`,
              outline: `2px solid rgba(212,168,67,0.25)`,
              outlineOffset: 2,
              overflow: 'hidden',
              background: '#fef3c7',
              boxShadow: `0 3px 10px rgba(0,0,0,0.1)`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              {node.avatar ? (
                <img
                  src={node.avatar}
                  alt={node.name}
                  style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                  onError={e => { e.currentTarget.style.display = 'none'; }}
                />
              ) : (
                <span style={{ fontSize: tier === 1 ? '1.7rem' : '1.3rem', color: '#b88429' }}>
                  {section === 'achar' ? '👤' : (node.name.includes('សមាជិកា') ? '👩' : '👤')}
                </span>
              )}
            </div>

            {/* Top Right Ornament Badge */}
            <div style={{
              position: 'absolute', top: -2, right: -2,
              width: 20, height: 20, borderRadius: '50%',
              background: `linear-gradient(135deg, ${borderColor}, #b88429)`,
              border: '1.5px solid #ffffff',
              color: '#fff', fontSize: 10, fontWeight: 700,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 2px 4px rgba(0,0,0,0.18)',
            }}>
              {node.sticker || (section === 'achar' ? '🖐️' : '🐍')}
            </div>
          </div>

          {/* Info Section */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, width: '100%' }}>
            <h3 style={{
              fontWeight: 800, color: '#2c1810', fontSize: s.nameSz,
              textAlign: 'center', lineHeight: 1.25, margin: 0,
              fontFamily: "'Noto Sans Khmer', sans-serif",
            }}>
              {node.name}
            </h3>

            {node.role && (
              <div style={{
                background: 'rgba(212,168,67,0.16)',
                border: '1px solid rgba(212,168,67,0.35)',
                borderRadius: 10,
                padding: '2px 8px',
                fontSize: s.roleSz,
                fontWeight: 700,
                color: '#4a3625',
                textAlign: 'center',
              }}>
                {node.role}
              </div>
            )}

            {node.phone && (
              <div style={{
                display: 'flex', alignItems: 'center', gap: 4,
                fontSize: '0.67rem', fontWeight: 700, color: '#2c1810', marginTop: 1,
              }}>
                <span style={{ fontSize: '0.72rem', color: '#b88429' }}>📞</span>
                <span>{node.phone}</span>
                {cs1 && (
                  <span style={{
                    background: cs1.bg, color: cs1.fg, border: `1px solid ${cs1.border}`,
                    fontSize: '0.54rem', fontWeight: 800, padding: '1px 4px', borderRadius: 6,
                    textTransform: 'lowercase',
                  }}>
                    {node.carrier.toLowerCase()}
                  </span>
                )}
              </div>
            )}

            {/* Social Link (Facebook) */}
            {tier === 1 && node.fb && (
              <div style={{ display: 'flex', gap: 6, marginTop: 1 }}>
                <a href={node.fb} target="_blank" rel="noopener noreferrer" style={{
                  width: 20, height: 20, borderRadius: '50%',
                  border: '1.5px solid rgba(44,24,16,0.35)',
                  color: '#2c1810', display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 10, textDecoration: 'none', fontWeight: 800,
                }}>f</a>
              </div>
            )}
          </div>

          {/* Action Buttons */}
          <div style={{ display: 'flex', gap: 6, marginTop: 4 }}>
            <button
              className="oc-btn"
              onClick={() => onEdit?.(node, section)}
              style={{ background: '#10b981', color: '#fff' }}
            >✏ Edit</button>
            <button
              className="oc-btn"
              onClick={() => onDelete?.(node, section)}
              style={{ background: '#ef4444', color: '#fff' }}
            >✕ Delete</button>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       TREE PANEL COMPONENT — Animated Running Lines
    ═══════════════════════════════════════════════════════════════════ */
    function TreePanel({ title, data, onEdit, onDelete, section }) {
      const containerRef = useRef(null);
      const [lines, setLines] = useState([]);
      const [joints, setJoints] = useState([]);

      const recalc = useCallback(() => {
        const container = containerRef.current;
        if (!container) return;

        const cRect = container.getBoundingClientRect();
        const getCoord = (id) => {
          const el = container.querySelector(`[data-nid="${id}"]`);
          if (!el) return null;
          const r = el.getBoundingClientRect();
          return {
            cx: r.left - cRect.left + r.width / 2,
            ty: r.top - cRect.top,
            by: r.bottom - cRect.top,
          };
        };

        const t1 = getCoord(data.tier1.id);
        if (!t1) return;

        const t2Coords = data.tier2.map(n => ({ ...getCoord(n.id), id: n.id })).filter(c => c.cx != null);
        const t3Coords = data.tier3.map(n => ({ ...getCoord(n.id), id: n.id, parentId: n.parentId })).filter(c => c.cx != null);

        const newLines = [];
        const newJoints = [];

        // Tier 1 → Tier 2 Horizontal Bus
        if (t2Coords.length > 0) {
          const upperMidY = t1.by + (t2Coords[0].ty - t1.by) / 2;
          newLines.push({ x1: t1.cx, y1: t1.by, x2: t1.cx, y2: upperMidY });
          newJoints.push({ cx: t1.cx, cy: upperMidY });

          const leftX = Math.min(...t2Coords.map(c => c.cx));
          const rightX = Math.max(...t2Coords.map(c => c.cx));

          if (t2Coords.length > 1) {
            newLines.push({ x1: leftX, y1: upperMidY, x2: rightX, y2: upperMidY });
          }

          t2Coords.forEach(c => {
            newLines.push({ x1: c.cx, y1: upperMidY, x2: c.cx, y2: c.ty });
            newJoints.push({ cx: c.cx, cy: upperMidY });
          });
        }

        // Tier 2 → Tier 3 Direct Drops
        t3Coords.forEach(t3Node => {
          const parentCoord = t2Coords.find(c => c.id === t3Node.parentId) || t2Coords[0];
          if (parentCoord) {
            newLines.push({ x1: parentCoord.cx, y1: parentCoord.by, x2: t3Node.cx, y2: t3Node.ty });
            const midY = parentCoord.by + (t3Node.ty - parentCoord.by) / 2;
            newJoints.push({ cx: parentCoord.cx, cy: midY });
          }
        });

        setLines(newLines);
        setJoints(newJoints);
      }, [data]);

      useEffect(() => {
        const t = setTimeout(recalc, 120);
        return () => clearTimeout(t);
      }, [recalc, data]);

      useEffect(() => {
        if (!containerRef.current) return;
        const ro = new ResizeObserver(() => setTimeout(recalc, 50));
        ro.observe(containerRef.current);
        return () => ro.disconnect();
      }, [recalc]);

      return (
        <div className="panel-box">
          {/* Panel Corner Motifs */}
          <div style={{ position: 'absolute', top: 6, left: 6, fontSize: '0.85rem', color: '#b88429' }}>❖</div>
          <div style={{ position: 'absolute', top: 6, right: 6, fontSize: '0.85rem', color: '#b88429' }}>❖</div>
          <div style={{ position: 'absolute', bottom: 6, left: 6, fontSize: '0.85rem', color: '#b88429' }}>❖</div>
          <div style={{ position: 'absolute', bottom: 6, right: 6, fontSize: '0.85rem', color: '#b88429' }}>❖</div>

          <h2 className="panel-header-banner">{title}</h2>

          <div style={{ width: '100%', overflowX: 'auto' }}>
            <div
              ref={containerRef}
              style={{
                position: 'relative',
                padding: '20px 14px 30px',
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: 48,
                minWidth: 'max-content',
                margin: '0 auto',
              }}
            >
              {/* SVG Connectors with Running Line Effect */}
              <svg
                aria-hidden="true"
                style={{
                  position: 'absolute', top: 0, left: 0,
                  width: '100%', height: '100%',
                  pointerEvents: 'none', zIndex: 1,
                }}
              >
                {/* Layer 1: Solid Background Line */}
                {lines.map((l, i) => (
                  <line
                    key={`line-bg-${i}`}
                    x1={l.x1} y1={l.y1}
                    x2={l.x2} y2={l.y2}
                    className="running-line-bg"
                  />
                ))}

                {/* Layer 2: Animated Running Beaded Line */}
                {lines.map((l, i) => (
                  <line
                    key={`line-fg-${i}`}
                    x1={l.x1} y1={l.y1}
                    x2={l.x2} y2={l.y2}
                    className="running-line-fg"
                  />
                ))}

                {/* Layer 3: Pulsing Joint Dots */}
                {joints.map((j, i) => (
                  <circle
                    key={`joint-${i}-${j.cx}-${j.cy}`}
                    cx={j.cx} cy={j.cy}
                    r="4.5"
                    fill="#d4a843"
                    stroke="#fff"
                    strokeWidth="2"
                    className="oc-joint"
                  />
                ))}
              </svg>

              {/* TIER 1 */}
              <div data-nid={data.tier1.id} style={{ zIndex: 2 }}>
                <NodeCard node={data.tier1} tier={1} onEdit={onEdit} onDelete={onDelete} section={section} />
              </div>

              {/* TIER 2 */}
              {data.tier2.length > 0 && (
                <div style={{ display: 'flex', gap: section === 'achar' ? 36 : 70, justifyContent: 'center', zIndex: 2 }}>
                  {data.tier2.map(node => (
                    <div key={node.id} data-nid={node.id}>
                      <NodeCard node={node} tier={2} onEdit={onEdit} onDelete={onDelete} section={section} />
                    </div>
                  ))}
                </div>
              )}

              {/* TIER 3 */}
              {data.tier3.length > 0 && (
                <div style={{ display: 'flex', gap: section === 'achar' ? 36 : 60, justifyContent: 'center', zIndex: 2 }}>
                  {data.tier3.map(node => (
                    <div key={node.id} data-nid={node.id}>
                      <NodeCard node={node} tier={3} onEdit={onEdit} onDelete={onDelete} section={section} />
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       EDIT MODAL
    ═══════════════════════════════════════════════════════════════════ */
    function EditModal({ item, onSave, onClose }) {
      const [draft, setDraft] = useState({ ...item.node });

      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => setDraft(p => ({ ...p, avatar: event.target.result }));
          reader.readAsDataURL(file);
        }
      };

      return (
        <div
          className="oc-modal-backdrop"
          onClick={onClose}
          style={{
            position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            zIndex: 9999, padding: 20,
          }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              background: '#fff', borderRadius: 22, padding: '24px 22px',
              width: '100%', maxWidth: 440, border: '2px solid rgba(212,168,67,0.3)',
              boxShadow: '0 24px 64px rgba(0,0,0,0.22)', maxHeight: '90vh', overflowY: 'auto',
            }}
          >
            <h3 style={{ fontWeight: 800, color: '#1a3a5c', marginBottom: 14, fontSize: '1.1rem' }}>
              ✏ កែប្រែសមាជិក / Edit Member ({item.section === 'achar' ? 'អាចារ្យ' : 'គណៈកម្មការ'})
            </h3>

            {/* Avatar Upload */}
            <div style={{
              background: '#f8fafc', border: '1.5px dashed #d4a843',
              borderRadius: 14, padding: 12, marginBottom: 14,
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
            }}>
              <div style={{ position: 'relative', width: 64, height: 64 }}>
                <div style={{
                  width: '100%', height: '100%', borderRadius: '50%',
                  border: '2px solid #d4a843', overflow: 'hidden', background: '#fef3c7',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  {draft.avatar ? (
                    <img src={draft.avatar} alt="Preview" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                  ) : (
                    <span style={{ fontSize: '1.5rem' }}>👤</span>
                  )}
                </div>
              </div>
              <label style={{
                background: 'linear-gradient(135deg, #1a3a5c, #2c5282)', color: '#f0d48a',
                borderRadius: 8, padding: '6px 14px', fontSize: '0.78rem', fontWeight: 700, cursor: 'pointer',
              }}>
                📷 Upload Photo File
                <input type="file" accept="image/*" onChange={handleFileUpload} style={{ display: 'none' }} />
              </label>
            </div>

            {/* Sticker Customization Picker */}
            <div style={{ marginBottom: 14 }}>
              <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#1a3a5c', display: 'block', marginBottom: 6 }}>
                🏷️ ជ្រើសរើស Sticker (Badge Icon: 🐍, 🖐️, 📿, 📜...)
              </label>

              {/* Quick Preset Buttons */}
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 8 }}>
                {['🐍', '🖐️', '📿', '📜', '☸', '🪷', '👑', '🛡️', '⭐️', '🏛️'].map(st => (
                  <button
                    key={st}
                    type="button"
                    onClick={() => setDraft(p => ({ ...p, sticker: st }))}
                    style={{
                      width: 34, height: 34, borderRadius: 8,
                      border: (draft.sticker || (item.section === 'achar' ? '🖐️' : '🐍')) === st ? '2px solid #b88429' : '1px solid #cbd5e1',
                      background: (draft.sticker || (item.section === 'achar' ? '🖐️' : '🐍')) === st ? '#fef3c7' : '#fff',
                      fontSize: '1.15rem', cursor: 'pointer',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      boxShadow: (draft.sticker || (item.section === 'achar' ? '🖐️' : '🐍')) === st ? '0 2px 6px rgba(184,132,41,0.25)' : 'none',
                    }}
                  >
                    {st}
                  </button>
                ))}
              </div>

              {/* Custom Sticker Input */}
              <input
                type="text"
                placeholder="ឬ បញ្ចូល Emoji/Sticker ផ្ទាល់ខ្លួន..."
                value={draft.sticker || ''}
                onChange={e => setDraft(p => ({ ...p, sticker: e.target.value }))}
                style={{
                  width: '100%', border: '1.5px solid rgba(212,168,67,0.5)',
                  borderRadius: 10, padding: '8px 12px', fontSize: '0.85rem', outline: 'none',
                }}
              />
            </div>

            {[
              ['name', 'ឈ្មោះ (Name)'],
              ['role', 'តួនាទី (Role)'],
              ['phone', 'លេខទូរស័ព្ទ (Phone)'],
              ['carrier', 'ប្រព័ន្ធ (Carrier: CELLCARD|METFONE|SMART)'],
            ].map(([k, label]) => (
              <div key={k} style={{ marginBottom: 12 }}>
                <label style={{ fontSize: '0.78rem', fontWeight: 600, color: '#374151', display: 'block', marginBottom: 3 }}>
                  {label}
                </label>
                <input
                  type="text"
                  value={draft[k] || ''}
                  onChange={e => setDraft(p => ({ ...p, [k]: e.target.value }))}
                  style={{
                    width: '100%', border: '1.5px solid rgba(212,168,67,0.5)',
                    borderRadius: 10, padding: '8px 12px', fontSize: '0.85rem', outline: 'none',
                  }}
                />
              </div>
            ))}

            <div style={{ display: 'flex', gap: 10, marginTop: 18 }}>
              <button
                onClick={() => onSave(draft, item.section)}
                style={{
                  flex: 1, background: 'linear-gradient(135deg, #d4a843, #b88429)',
                  border: 'none', borderRadius: 12, color: '#fff', padding: '10px 0',
                  fontWeight: 700, cursor: 'pointer',
                }}
              >💾 រក្សាទុក</button>
              <button
                onClick={onClose}
                style={{
                  flex: 1, background: '#f1f5f9', border: '1px solid #cbd5e1',
                  borderRadius: 12, color: '#334155', padding: '10px 0', fontWeight: 600, cursor: 'pointer',
                }}
              >បោះបង់</button>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       APP MAIN WITH FULL ADMIN LAYOUT
    ═══════════════════════════════════════════════════════════════════ */
    function App() {
      const [acharTree, setAcharTree]         = useState(INITIAL_ACHAR_DATA);
      const [committeeTree, setCommitteeTree] = useState(INITIAL_COMMITTEE_DATA);
      const [editing, setEditing]             = useState(null);
      const [toast, setToast]                 = useState('');

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'public') {
          document.body.classList.add('is-public');
        }
        if (window.self !== window.top) {
          document.body.classList.add('is-embedded');
        }
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3500);
      };

      const handleTabSwitch = (targetUrl) => {
        const card = document.querySelector('.gold-card-container');
        if (card) card.classList.add('page-transition-exit');
        setTimeout(() => {
          const search = window.location.search;
          window.location.href = targetUrl + search;
        }, 180);
      };

      const handleEdit = (node, section) => setEditing({ node, section });

      const handleDelete = (node, section) => {
        const isAchar = section === 'achar';
        const data = isAchar ? acharTree : committeeTree;
        const setData = isAchar ? setAcharTree : setCommitteeTree;

        if (node.id === data.tier1.id) {
          showToast('⚠️ មិនអាចលុបប្រធានបានទេ!');
          return;
        }

        setData(prev => ({
          ...prev,
          tier2: prev.tier2.filter(n => n.id !== node.id),
          tier3: prev.tier3.filter(n => n.id !== node.id),
        }));
        showToast(`🗑️ បានលុបសមាជិក: ${node.name}`);
      };

      const handleSave = (updated, section) => {
        const isAchar = section === 'achar';
        const setData = isAchar ? setAcharTree : setCommitteeTree;

        setData(prev => {
          if (prev.tier1.id === updated.id) return { ...prev, tier1: updated };
          return {
            ...prev,
            tier2: prev.tier2.map(n => n.id === updated.id ? updated : n),
            tier3: prev.tier3.map(n => n.id === updated.id ? updated : n),
          };
        });

        showToast(`✅ បានកែប្រែ: ${updated.name}`);
        setEditing(null);
      };

      const toggleFullScreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      };

      const menuItems = [
        { icon: '📊', label: 'ផ្ទាំងគ្រប់គ្រង' },
        { icon: '☸️', label: 'ព្រះសង្ឃ' },
        { icon: '📜', label: 'រចនាសម្ព័ន្ធ' },
        { icon: '🎥', label: 'វីដេអូ' },
        { icon: '📅', label: 'ព្រឹត្តិការណ៍' },
        { icon: '🗓️', label: 'ប្រតិទិន' },
        { icon: '📰', label: 'ព័ត៌មាន' },
        { icon: '🎁', label: 'ម្ចាស់ទាន/សប្បុរសជន' },
        { icon: '🏛️', label: 'រចនាសម្ព័ន្ធគ្រប់គ្រង', active: true },
        { icon: '💬', label: 'ទំនាក់ទំនង និង យោបល់' },
        { icon: '👥', label: 'គ្រប់គ្រងអ្នកប្រើ' },
      ];

      return (
        <React.Fragment>
          {/* Admin Sidebar */}
          <aside className="admin-sidebar">
            <div className="sidebar-brand">
              <div style={{
                width: 36, height: 36, borderRadius: '50%', background: '#d4a843',
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.2rem', color: '#fff'
              }}>☸</div>
              <div>
                <h2>វត្តខេមវ័ន</h2>
                <span>បឹងស្នាយ</span>
              </div>
            </div>

            <div className="sidebar-menu">
              {menuItems.map((item, idx) => (
                <div key={idx} className={`menu-item ${item.active ? 'active' : ''}`}>
                  <span>{item.icon}</span>
                  <span>{item.label}</span>
                </div>
              ))}
            </div>

            <div style={{ padding: '16px 20px', borderTop: '1px solid rgba(255,255,255,0.08)', fontSize: '0.78rem', color: '#64748b' }}>
              ☸ ADMIN v2.6
            </div>
          </aside>

          {/* Admin Main Content */}
          <main className="admin-main">
            {/* Top Bar */}
            <div className="top-header">
              <div className="header-title">
                <h1>រចនាសម្ព័ន្ធអាចារ្យ & គណៈកម្មការ</h1>
                <p>ផ្ទាំងគ្រប់គ្រង / រចនាសម្ព័ន្ធអាចារ្យ និង គណៈកម្មការ</p>
              </div>

              <button className="fullscreen-btn" onClick={toggleFullScreen}>
                <span>🔗</span>
                <span>មើលពេញអេក្រង់ (Full Screen)</span>
              </button>
            </div>

            {/* Tree Workspace */}
            <div className="tree-wrapper">
              <div className="gold-card-container">
                {/* Background Pattern Watermarks */}
                <div className="bg-watermark-left" />
                <div className="bg-watermark-right" />

                {/* Center Lotus Emblem */}
                <div className="top-lotus-emblem" title="Wat Khemvoen Lotus Emblem">
                  🪷
                </div>

                {/* Category Tab Buttons */}
                <div className="tab-switcher-wrapper">
                  <div className="tab-switcher-nav">
                    <button
                      className="tab-nav-btn"
                      type="button"
                      onClick={() => handleTabSwitch('monks-chart.html')}
                    >
                      <span className="tab-icon">☸</span>
                      <span>រចនាសម្ព័ន្ធព្រះសង្ឃ</span>
                    </button>
                    <button className="tab-nav-btn active" type="button">
                      <span className="tab-icon">👥</span>
                      <span>អាចារ្យ & គណៈកម្មការ</span>
                    </button>
                  </div>
                </div>

                <div className="dual-grid">
                  {/* LEFT PANEL: ផ្នែកអាចារ្យ */}
                  <TreePanel
                    title="រចនាសម្ព័ន្ធអាចារ្យ"
                    data={acharTree}
                    onEdit={handleEdit}
                    onDelete={handleDelete}
                    section="achar"
                  />

                  {/* RIGHT PANEL: ផ្នែកគណៈកម្មការ */}
                  <TreePanel
                    title="រចនាសម្ព័ន្ធគណៈកម្មការ"
                    data={committeeTree}
                    onEdit={handleEdit}
                    onDelete={handleDelete}
                    section="committee"
                  />
                </div>
              </div>
            </div>
          </main>

          {/* EDIT MODAL */}
          {editing && (
            <EditModal
              item={editing}
              onSave={handleSave}
              onClose={() => setEditing(null)}
            />
          )}

          {/* TOAST */}
          {toast && (
            <div style={{
              position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)',
              background: '#1a3a5c', color: '#fff', padding: '10px 22px', borderRadius: 12,
              fontSize: '0.85rem', fontWeight: 700, border: '1.5px solid #d4a843',
              boxShadow: '0 8px 24px rgba(0,0,0,0.25)', zIndex: 99999,
            }}>
              {toast}
            </div>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
