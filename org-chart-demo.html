<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Org Chart — Hierarchy Tree Component</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind (config extended inside script) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT:'#d4a843', light:'#f0d48a', dark:'#b88429', muted:'rgba(212,168,67,0.35)' },
            cream: '#fdf8f0',
            navy: { DEFAULT:'#1a3a5c', dark:'#0f2640', light:'#2c5282' },
          }
        }
      }
    };
  </script>

  <!-- React 18 + ReactDOM + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans Khmer', sans-serif;
      background: #fdf8f0;
      min-height: 100vh;
      color: #2c3e50;
    }

    /* ── Card hover lift ── */
    .oc-card {
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1),
                  box-shadow 0.25s cubic-bezier(0.4,0,0.2,1),
                  border-color 0.25s ease;
    }
    .oc-card:hover {
      transform: translateY(-5px);
      box-shadow:
        0 16px 40px rgba(0,0,0,0.1),
        0 0 0 2px rgba(212,168,67,0.45) !important;
    }
    .oc-card:hover .oc-avatar-ring {
      border-color: #c49530;
      box-shadow: 0 6px 20px rgba(212,168,67,0.35);
    }

    /* ── Avatar ring ── */
    .oc-avatar-ring {
      border-radius: 50%;
      border: 3px solid #d4a843;
      outline: 2.5px solid rgba(212,168,67,0.28);
      outline-offset: 3px;
      overflow: hidden;
      background: #f1f5f9;
      box-shadow: 0 4px 14px rgba(0,0,0,0.10);
      transition: border-color 0.25s, box-shadow 0.25s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ── Action buttons ── */
    .oc-btn {
      border: none; cursor: pointer; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.18s ease, filter 0.18s ease;
      font-size: 12px; font-weight: 700;
    }
    .oc-btn:hover { transform: scale(1.15); filter: brightness(1.1); }

    /* ── Scrollable chart wrapper ── */
    .oc-scroll {
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(212,168,67,0.45) transparent;
    }
    .oc-scroll::-webkit-scrollbar { height: 5px; }
    .oc-scroll::-webkit-scrollbar-track { background: rgba(212,168,67,0.08); border-radius: 3px; }
    .oc-scroll::-webkit-scrollbar-thumb { background: rgba(212,168,67,0.45); border-radius: 3px; }

    /* ── SVG line draw animation ── */
    @keyframes ocLineDraw {
      from { stroke-dashoffset: 800; opacity: 0; }
      to   { stroke-dashoffset: 0;   opacity: 1; }
    }
    .oc-line {
      stroke-dasharray: 800;
      animation: ocLineDraw 0.55s cubic-bezier(0.4,0,0.2,1) both;
    }

    /* ── Toast ── */
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 14px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* ── Modal backdrop ── */
    .oc-modal-backdrop {
      animation: fadeIn 0.2s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── Pulsing glow on junction dots ── */
    @keyframes ocPulse {
      0%, 100% { r: 4.5; opacity: 0.9; }
      50%       { r: 6;   opacity: 1;   }
    }
    .oc-joint { animation: ocPulse 3s ease-in-out infinite; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    /* ═══════════════════════════════════════════════════════════════════
       SAMPLE DATA  — 3-tier Monk Organizational Hierarchy (Image 2 structure)
    ═══════════════════════════════════════════════════════════════════ */
    const INITIAL_DATA = {
      id: 'root',
      name: 'ព្រះគ្រូចៅអធិការវត្ត',

      fb: '#', ig: '#',

        {

          role: 'ព្រះគ្រូសូត្រស្ដាំ',

        },
        {
          id: 'dep2',
          name: 'ព្រះគ្រូសូត្រឆ្វេង',
          role: 'ព្រះគ្រូសូត្រឆ្វេង',
          roleEn: 'Left-Side Recitation Master',
          avatar: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=400&q=80',
          phone: '915 777 888',

          fb: '#', ig: '#',
        },
      ],
      officers: [
        {
          id: 'off1',

          roleEn: 'Venerable Discipline Master',
          avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80',
          phone: '097 111 366',

        {

          roleEn: 'Venerable Secretary',
          avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80',
          phone: '099 111 234',

          fb: '#',
        },
        {
          id: 'off3',
          name: 'ភត្តទ្ទេសក៍',
          role: 'ភត្តទ្ទេសក៍',
          roleEn: 'Venerable Meal Master / Bhaktaddeshaka',
          avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=400&q=80',
          phone: '013 777 444',
          carrier: 'SMART',
          carrier2: 'CELLCARD',

        },
      ],
    };

    /* ═══════════════════════════════════════════════════════════════════
       CONSTANTS & STYLING HELPER
    ═══════════════════════════════════════════════════════════════════ */
    const CARRIER = {
      CELLCARD: { bg: '#fff0e6', fg: '#c85a00', border: '#ffb380' },
      METFONE:  { bg: '#fee2e2', fg: '#991b1b', border: '#fca5a5' },
      SMART:    { bg: '#dcfce7', fg: '#166534', border: '#86efac' },
    };
    const carrierStyle = (c) => CARRIER[String(c).toUpperCase()] ?? { bg: '#f3f4f6', fg: '#374151', border: '#d1d5db' };

    /* ═══════════════════════════════════════════════════════════════════
       NODE CARD  — Parchment Ornate Style (Matching Image 2)
    ═══════════════════════════════════════════════════════════════════ */
    function NodeCard({ node, tier = 1, onEdit, onDelete }) {
      const cs1 = node.carrier ? carrierStyle(node.carrier) : null;
      const cs2 = node.carrier2 ? carrierStyle(node.carrier2) : null;
      const cardW = tier === 1 ? 240 : (tier === 2 ? 220 : 215);

      return (
        <div
          className="oc-card"
          style={{
            width: cardW,
            background: 'linear-gradient(180deg, #fffdf8 0%, #faf3e6 100%)',
            borderRadius: 20,
            border: '2px solid #d4a843',
            boxShadow: '0 8px 24px rgba(44,24,16,0.08), inset 0 0 0 3px rgba(212,168,67,0.18)',
            padding: '18px 14px 14px',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            gap: 10,
            position: 'relative',
          }}
        >
          {/* Top Decorative Arch Notch Accent */}
          <div style={{
            position: 'absolute', top: -1, left: '50%', transform: 'translateX(-50%)',
            width: 42, height: 4, background: '#d4a843', borderRadius: '0 0 4px 4px',
          }} />

          {/* ── Avatar Container with Lotus Emblem ── */}
          <div style={{ position: 'relative', width: 92, height: 92 }}>
            <div style={{
              width: '100%', height: '100%',
              borderRadius: '50%',
              border: '3.5px solid #c49a45',
              outline: '2px solid rgba(212,168,67,0.3)',
              outlineOffset: 2,
              overflow: 'hidden',
              background: '#fef3c7',
              boxShadow: '0 4px 12px rgba(0,0,0,0.12)',
            }}>
              {node.avatar ? (
                <img
                  src={node.avatar}
                  alt={node.name}
                  style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                  onError={e => { e.currentTarget.style.display = 'none'; }}
                />
              ) : (
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', fontSize: '2.2rem', color: '#b88429' }}>
                  ☸
                </div>
              )}
            </div>

            {/* Top-Right Lotus Ornament Badge */}
            <div style={{
              position: 'absolute', top: -2, right: -2,
              width: 24, height: 24, borderRadius: '50%',
              background: 'linear-gradient(135deg, #d4a843, #b88429)',
              border: '2px solid #ffffff',
              color: '#fff', fontSize: 11, fontWeight: 700,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 2px 6px rgba(0,0,0,0.2)',
            }}>
              ☸
            </div>
          </div>

          {/* ── Name (Khmer Title) ── */}
          <h3 style={{
            fontWeight: 800, color: '#2c1810', fontSize: '1.02rem',
            textAlign: 'center', lineHeight: 1.25, margin: 0,
            fontFamily: "'Noto Sans Khmer', sans-serif",
          }}>
            {node.name}
          </h3>

          {/* ── English Subtitle Pill ── */}
          {node.roleEn && (
            <div style={{
              background: 'rgba(212, 168, 67, 0.20)',
              border: '1px solid rgba(212, 168, 67, 0.35)',
              borderRadius: 14,
              padding: '3px 12px',
              fontSize: '0.72rem',
              fontWeight: 700,
              color: '#4a3625',
              textAlign: 'center',
              lineHeight: 1.3,
            }}>
              {node.roleEn}
            </div>
          )}

          {/* ── Phone & Carrier Pill ── */}
          {node.phone && (
            <div style={{
              background: '#ffffff',
              border: '1.5px solid rgba(212, 168, 67, 0.45)',
              borderRadius: 18,
              padding: '4px 12px',
              display: 'flex',
              alignItems: 'center',
              gap: 6,
              fontSize: '0.75rem',
              fontWeight: 700,
              color: '#2c1810',
              boxShadow: '0 2px 6px rgba(0,0,0,0.03)',
            }}>
              <span style={{ fontSize: '0.8rem', color: '#b88429' }}>📞</span>
              <span>{node.phone}</span>
              {cs1 && (
                <span style={{
                  background: cs1.bg, color: cs1.fg, border: `1px solid ${cs1.border}`,
                  fontSize: '0.62rem', fontWeight: 800, padding: '1px 6px', borderRadius: 10,
                  textTransform: 'lowercase',
                }}>
                  {node.carrier.toLowerCase()}
                </span>
              )}
              {cs2 && (
                <span style={{
                  background: cs2.bg, color: cs2.fg, border: `1px solid ${cs2.border}`,
                  fontSize: '0.62rem', fontWeight: 800, padding: '1px 6px', borderRadius: 10,
                  textTransform: 'lowercase',
                }}>
                  {node.carrier2.toLowerCase()}
                </span>
              )}
            </div>
          )}

          {/* ── Social Footer Buttons ── */}
          {(node.fb || node.ig) && (
            <div style={{ display: 'flex', gap: 10, marginTop: 2 }}>
              {node.fb && (
                <a href={node.fb} target="_blank" rel="noopener noreferrer" style={{
                  width: 24, height: 24, borderRadius: '50%',
                  border: '1.5px solid rgba(44, 24, 16, 0.4)',

                }}>f</a>
              )}

    /* ═══════════════════════════════════════════════════════════════════
       ORG CHART  — 3-Tier Dynamic Layout matching Image 2
    ═══════════════════════════════════════════════════════════════════ */
    function OrgChart({ data = INITIAL_DATA, onEdit, onDelete }) {
      const containerRef = useRef(null);
      const [lines, setLines] = useState([]);

      const recalc = useCallback(() => {
        const container = containerRef.current;
        if (!container) return;

        const cRect = container.getBoundingClientRect();
        const getCoord = (id) => {
          const el = container.querySelector(`[data-nid="${id}"]`);
          if (!el) return null;
          const r = el.getBoundingClientRect();
          return {
            cx: r.left - cRect.left + r.width / 2,
            ty: r.top - cRect.top,
            by: r.bottom - cRect.top,
          };
        };

        const rootP = getCoord(data.id);
        const dep1P = getCoord(data.deputies?.[0]?.id);
        const dep2P = getCoord(data.deputies?.[1]?.id);
        const off1P = getCoord(data.officers?.[0]?.id);
        const off2P = getCoord(data.officers?.[1]?.id);
        const off3P = getCoord(data.officers?.[2]?.id);

        if (!rootP) return;

        const calculatedLines = [];

        /* 1. Upper Connector: Root -> Deputies */
        if (dep1P && dep2P) {
          const upperY = rootP.by + (dep1P.ty - rootP.by) / 2;
          // Stem down from Root
          calculatedLines.push({ x1: rootP.cx, y1: rootP.by, x2: rootP.cx, y2: upperY });
          // Horizontal bar spanning Left & Right Deputies
          calculatedLines.push({ x1: dep1P.cx, y1: upperY, x2: dep2P.cx, y2: upperY });
          // Vertical drops into Deputy 1 & Deputy 2
          calculatedLines.push({ x1: dep1P.cx, y1: upperY, x2: dep1P.cx, y2: dep1P.ty });
          calculatedLines.push({ x1: dep2P.cx, y1: upperY, x2: dep2P.cx, y2: dep2P.ty });

          /* 2. Central Trunk: Straight down from Root through middle gap to Officers */
          if (off1P && off3P) {
            const lowerY = dep1P.by + (off1P.ty - dep1P.by) / 2;
            // Trunk line from upperY straight down to lowerY
            calculatedLines.push({ x1: rootP.cx, y1: upperY, x2: rootP.cx, y2: lowerY });
            // Lower horizontal bar spanning all 3 Officer cards
            calculatedLines.push({ x1: off1P.cx, y1: lowerY, x2: off3P.cx, y2: lowerY });
            // 3 vertical drops into top of each Officer card
            calculatedLines.push({ x1: off1P.cx, y1: lowerY, x2: off1P.cx, y2: off1P.ty });
            if (off2P) calculatedLines.push({ x1: off2P.cx, y1: lowerY, x2: off2P.cx, y2: off2P.ty });
            calculatedLines.push({ x1: off3P.cx, y1: lowerY, x2: off3P.cx, y2: off3P.ty });
          }
        }

        setLines(calculatedLines);
      }, [data]);

      useEffect(() => {
        const t = setTimeout(recalc, 100);
        return () => clearTimeout(t);
      }, [recalc, data]);

      useEffect(() => {
        if (!containerRef.current) return;
        const ro = new ResizeObserver(() => setTimeout(recalc, 30));
        ro.observe(containerRef.current);
        return () => ro.disconnect();
      }, [recalc]);

      return (
        <div className="oc-scroll" style={{ width: '100%' }}>
          <div
            ref={containerRef}
            style={{
              position: 'relative',
              padding: '36px 24px 48px',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              gap: 60,
              minWidth: 'max-content',
            }}
          >
            {/* SVG Connector Layer */}
            <svg
              aria-hidden="true"
              style={{
                position: 'absolute',
                top: 0, left: 0,
                width: '100%', height: '100%',
                pointerEvents: 'none',
                zIndex: 1,
              }}
            >
              {lines.map((l, i) => (
                <line
                  key={i}
                  x1={l.x1} y1={l.y1}
                  x2={l.x2} y2={l.y2}
                  stroke="#d4a843"
                  strokeWidth="2.5"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              ))}
            </svg>

            {/* ═══ TIER 1: Chief Abbot (Top Center) ═══ */}
            <div data-nid={data.id} style={{ zIndex: 2 }}>
              <NodeCard node={data} tier={1} onEdit={onEdit} onDelete={onDelete} />
            </div>

            {/* ═══ TIER 2: Recitation Masters (Left & Right) ═══ */}
            {data.deputies?.length > 0 && (
              <div style={{ display: 'flex', gap: 140, justifyContent: 'center', zIndex: 2 }}>
                {data.deputies.map(dep => (
                  <div key={dep.id} data-nid={dep.id}>
                    <NodeCard node={dep} tier={2} onEdit={onEdit} onDelete={onDelete} />
                  </div>
                ))}
              </div>
            )}

            {/* ═══ TIER 3: Officers (Bottom Row) ═══ */}
            {data.officers?.length > 0 && (
              <div style={{ position: 'relative', zIndex: 2 }}>
                {/* Horizontal Gold Banner Accent behind Tier 3 cards */}
                <div style={{
                  position: 'absolute',
                  top: '48%', left: -20, right: -20, height: 42,
                  background: 'linear-gradient(90deg, transparent 0%, rgba(212,168,67,0.25) 15%, rgba(212,168,67,0.40) 50%, rgba(212,168,67,0.25) 85%, transparent 100%)',
                  borderRadius: 10,
                  transform: 'translateY(-50%)',
                  pointerEvents: 'none',
                  zIndex: 0,
                }} />

                <div style={{ display: 'flex', gap: 32, justifyContent: 'center', position: 'relative', zIndex: 1 }}>
                  {data.officers.map(off => (
                    <div key={off.id} data-nid={off.id}>
                      <NodeCard node={off} tier={3} onEdit={onEdit} onDelete={onDelete} />
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       EDIT MODAL
    ═══════════════════════════════════════════════════════════════════ */
    const EDIT_FIELDS = [
      ['name',    'ឈ្មោះ / Name'],
      ['role',    'តួនាទី (ខ្មែរ) / Role (KH)'],
      ['roleEn',  'Role (English)'],
      ['phone',   'លេខទូរស័ព្ទ / Phone'],
      ['carrier', 'ប្រព័ន្ធ / Carrier (CELLCARD|METFONE|SMART)'],
      ['avatar',  'Avatar URL'],
      ['fb',      'Facebook URL'],
      ['tg',      'Telegram URL'],
    ];

    function EditModal({ node, onSave, onClose }) {
      const [draft, setDraft] = useState({ ...node });

      return (
        <div
          className="oc-modal-backdrop"
          onClick={onClose}
          style={{
            position: 'fixed', inset: 0,
            background: 'rgba(0,0,0,0.52)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            zIndex: 9999, padding: 20,
          }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              background: '#fff',
              borderRadius: 22,
              padding: '28px 24px',
              width: '100%', maxWidth: 440,
              border: '2px solid rgba(212,168,67,0.3)',
              boxShadow: '0 24px 64px rgba(0,0,0,0.22)',
              maxHeight: '90vh', overflowY: 'auto',
            }}
          >
            <h3 style={{ fontWeight: 800, color: '#1a3a5c', marginBottom: 4 }}>
              ✏ Edit Node
            </h3>
            <p style={{ fontSize: '0.78rem', color: '#94a3b8', marginBottom: 18 }}>
              ID: <code style={{ background: '#f1f5f9', padding: '1px 4px', borderRadius: 4 }}>
                {node.id}
              </code>
            </p>

            {EDIT_FIELDS.map(([key, label]) => (
              <div key={key} style={{ marginBottom: 11 }}>
                <label style={{
                  fontSize: '0.78rem', fontWeight: 600,
                  color: '#374151', display: 'block', marginBottom: 3,
                }}>
                  {label}
                </label>
                <input
                  type="text"
                  value={draft[key] || ''}
                  onChange={e => setDraft(p => ({ ...p, [key]: e.target.value }))}
                  style={{
                    width: '100%', border: '1.5px solid rgba(212,168,67,0.5)',
                    borderRadius: 9, padding: '7px 10px',
                    fontSize: '0.85rem', outline: 'none',
                    fontFamily: 'inherit', color: '#1a3a5c',
                    transition: 'border-color 0.2s',
                  }}
                  onFocus={e => e.target.style.borderColor = '#d4a843'}
                  onBlur={e  => e.target.style.borderColor = 'rgba(212,168,67,0.5)'}
                />
              </div>
            ))}

            <div style={{ display: 'flex', gap: 10, marginTop: 20 }}>
              <button
                onClick={() => onSave(draft)}
                style={{
                  flex: 1,
                  background: 'linear-gradient(135deg, #d4a843, #b88429)',
                  border: 'none', borderRadius: 11,
                  color: '#fff', padding: '10px 0',
                  fontWeight: 700, fontSize: '0.9rem', cursor: 'pointer',
                  boxShadow: '0 4px 12px rgba(212,168,67,0.35)',
                }}
              >💾 Save</button>
              <button
                onClick={onClose}
                style={{
                  flex: 1,
                  background: '#f1f5f9', border: '1.5px solid #e2e8f0',
                  borderRadius: 11, color: '#374151',
                  padding: '10px 0', fontWeight: 600, cursor: 'pointer',
                }}
              >Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════
       HELPERS
    ═══════════════════════════════════════════════════════════════════ */
    function treeUpdate(tree, updatedNode) {
      if (tree.id === updatedNode.id) return { ...updatedNode, children: tree.children };
      return { ...tree, children: (tree.children || []).map(c => treeUpdate(c, updatedNode)) };
    }

    function treeRemove(tree, targetId) {
      if (tree.id === targetId) return null;
      return {
        ...tree,
        children: (tree.children || []).map(c => treeRemove(c, targetId)).filter(Boolean),
      };
    }

    /* ═══════════════════════════════════════════════════════════════════
       APP
    ═══════════════════════════════════════════════════════════════════ */
    function App() {
      const [data,    setData]    = useState(INITIAL_DATA);
      const [editing, setEditing] = useState(null);
      const [toast,   setToast]   = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const handleEdit   = (node) => setEditing(node);
      const handleDelete = (node) => {
        if (node.id === 'root') { showToast('⚠️ Cannot delete the root node'); return; }
        setData(d => treeRemove(d, node.id));
        showToast(`🗑️ Deleted: ${node.name}`);
      };

      const handleSave = (updated) => {
        setData(d => treeUpdate(d, updated));
        showToast(`✅ Updated: ${updated.name}`);
        setEditing(null);
      };

      return (
        <div style={{ minHeight: '100vh', background: '#fdf8f0' }}>

          {/* ── Top Nav ── */}
          <header style={{
            background: 'linear-gradient(135deg, #0f2640 0%, #1a3a5c 60%, #2c5282 100%)',
            borderBottom: '3px solid #d4a843',
            padding: '18px 28px',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            flexWrap: 'wrap', gap: 12,
          }}>
            <div>
              <h1 style={{ margin: 0, fontSize: '1.35rem', fontWeight: 800, color: '#f0d48a' }}>
                ☸ Org Chart · Hierarchy Tree Component
              </h1>
              <p style={{ margin: '3px 0 0', fontSize: '0.78rem', color: 'rgba(255,255,255,0.55)' }}>
                React 18 · SVG Lines · Cream / Gold Theme · Responsive
              </p>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button
                onClick={() => setData(INITIAL_DATA)}
                style={{
                  background: 'rgba(212,168,67,0.15)',
                  border: '1.5px solid #d4a843',
                  borderRadius: 10, color: '#f0d48a',
                  padding: '8px 18px', fontSize: '0.82rem', fontWeight: 700,
                  cursor: 'pointer',
                }}
              >↺ Reset</button>
            </div>
          </header>

          {/* ── Main ── */}
          <main style={{ padding: '36px 20px', maxWidth: 1600, margin: '0 auto' }}>

            {/* Chart wrapper */}
            <div style={{
              background: 'linear-gradient(135deg, #fffdf8 0%, #f3e9d4 40%, #faf4ea 70%, #fffdf8 100%)',
              border: '2.5px solid #d4a843',
              borderRadius: 28,
              overflow: 'hidden',
              boxShadow: '0 20px 60px rgba(0,0,0,0.07), 0 4px 16px rgba(212,168,67,0.09)',
              position: 'relative',
            }}>
              {/* Inner decorative border */}
              <div style={{
                position: 'absolute', inset: 8,
                border: '1px solid rgba(212,168,67,0.18)',
                borderRadius: 22, pointerEvents: 'none', zIndex: 0,
              }} />

              {/* Chart header */}
              <div style={{
                textAlign: 'center',
                padding: '32px 24px 0',
                position: 'relative', zIndex: 1,
              }}>
                <h2 style={{
                  fontSize: '2rem', fontWeight: 900, color: '#2c1810',
                  textShadow: '0 1px 2px rgba(0,0,0,0.06)',
                }}>
                  រចនាសម្ព័ន្ធគ្រប់គ្រង
                </h2>
                <p style={{ color: '#8a7a68', fontSize: '0.9rem', marginTop: 6 }}>
                  វត្តខេមវ័ន(បឹងស្នាយ) · ☸️ ឋានានុក្រមព្រះសង្ឃ
                </p>
                <div style={{
                  display: 'inline-block', marginTop: 12,
                  background: 'linear-gradient(135deg, #1a3a5c, #2c5282)',
                  border: '1.5px solid #d4a843', borderRadius: 25,
                  color: '#d4a843', padding: '7px 22px',
                  fontSize: '0.88rem', fontWeight: 700,
                }}>
                  ☸ ព្រះសង្ឃ
                </div>
              </div>

              {/* THE ORG CHART */}
              <OrgChart
                data={data}
                onEdit={handleEdit}
                onDelete={handleDelete}
              />
            </div>

            {/* Legend */}
            <div style={{
              display: 'flex', gap: 10, flexWrap: 'wrap',
              justifyContent: 'center', marginTop: 20,
            }}>
              {[
                { icon: '✏', color: '#d4a843', label: 'Edit node' },
                { icon: '✕', color: '#ef4444', label: 'Delete node' },
                { icon: '↺', color: '#1a3a5c', label: 'Reset tree' },
                { icon: '→', color: '#6b7280', label: 'Scroll if tree is wide' },
              ].map(({ icon, color, label }) => (
                <div key={label} style={{
                  display: 'flex', alignItems: 'center', gap: 6,
                  background: '#fff', border: '1px solid #e2e8f0',
                  borderRadius: 10, padding: '6px 13px',
                  fontSize: '0.78rem', color: '#4b5563',
                  boxShadow: '0 1px 4px rgba(0,0,0,0.04)',
                }}>
                  <span style={{ color, fontWeight: 700 }}>{icon}</span>
                  {label}
                </div>
              ))}
            </div>

            {/* ── Code note ── */}
            <details style={{ marginTop: 28, background: '#1a3a5c', borderRadius: 16, overflow: 'hidden' }}>
              <summary style={{
                padding: '14px 20px', color: '#f0d48a', fontWeight: 700,
                fontSize: '0.88rem', cursor: 'pointer', userSelect: 'none',
              }}>
                📐 How SVG lines are calculated (no dangling stubs)
              </summary>
              <div style={{ padding: '0 20px 18px', color: 'rgba(255,255,255,0.75)', fontSize: '0.82rem', lineHeight: 1.8 }}>
                <pre style={{ background: 'rgba(0,0,0,0.3)', borderRadius: 10, padding: 16, overflow: 'auto', fontSize: '0.78rem' }}>{`
For each parent P with children C0…Cn:

  midY = P.bottom + (C0.top − P.bottom) / 2

  1. STEM  : P.cx,    P.bottom → P.cx,    midY     (straight down)
  2. HBAR  : C0.cx,  midY     → Cn.cx,   midY     (first to last ← the key fix!)
  3. DROPS : Ci.cx,  midY     → Ci.cx,   Ci.top   (one per child)

The horizontal bar uses ACTUAL measured child centres from
getBoundingClientRect(), so it never overhangs or falls short.
                `.trim()}</pre>
              </div>
            </details>
          </main>

          {/* ── Edit Modal ── */}
          {editing && (
            <EditModal
              node={editing}
              onSave={handleSave}
              onClose={() => setEditing(null)}
            />
          )}

          {/* ── Toast notification ── */}
          {toast && (
            <div style={{
              position: 'fixed', bottom: 24,
              left: '50%', transform: 'translateX(-50%)',
              background: '#1a3a5c', color: '#fff',
              padding: '10px 22px', borderRadius: 14,
              fontSize: '0.85rem', fontWeight: 600,
              boxShadow: '0 8px 28px rgba(0,0,0,0.22)',
              border: '1.5px solid #d4a843',
              zIndex: 99999,
              animation: 'toastIn 0.3s ease both',
              whiteSpace: 'nowrap',
            }}>
              {toast}
            </div>
          )}
          <style>{`
            @keyframes toastIn {
              from { opacity:0; transform:translate(-50%,12px); }
              to   { opacity:1; transform:translate(-50%,0); }
            }
          `}</style>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
